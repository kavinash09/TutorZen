services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorzen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutorzen_dev
      POSTGRES_USER: tutorzen
      POSTGRES_PASSWORD: tutorzen_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

