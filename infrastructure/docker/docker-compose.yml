services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorzen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutorzen_dev
      POSTGRES_USER: tutorzen
      POSTGRES_PASSWORD: tutorzen_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorzen -d tutorzen_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: tutorzen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tutorzen_dev
      SPRING_DATASOURCE_USERNAME: tutorzen
      SPRING_DATASOURCE_PASSWORD: tutorzen_secret
      JWT_SECRET: dev-secret-key-must-be-replaced-in-production-environment-32chars
      JWT_EXPIRY_SECONDS: 900
      JWT_REFRESH_EXPIRY_SECONDS: 604800
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: apps/mobile/Dockerfile
    container_name: tutorzen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8081"

volumes:
  postgres_data:
