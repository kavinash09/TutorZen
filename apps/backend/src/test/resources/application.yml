spring:
  application:
    name: tutorzen-backend-test
  datasource:
    url: jdbc:h2:mem:tutorzen_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

server:
  port: -1

tutorzen:
  security:
    jwt-secret: test-jwt-secret-key-for-testing-purposes-must-be-32-chars-long
    jwt-expiry-seconds: 900
    jwt-refresh-expiry-seconds: 604800

