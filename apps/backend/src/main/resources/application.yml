spring:
  application:
    name: tutorzen-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutorzen_dev}
    username: ${SPRING_DATASOURCE_USERNAME:tutorzen}
    password: ${SPRING_DATASOURCE_PASSWORD:tutorzen_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

tutorzen:
  security:
    jwt-secret: ${JWT_SECRET:dev-secret-key-must-be-replaced-in-production-environment-32chars}
    jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:900}          # 15 minutes
    jwt-refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800}  # 7 days

